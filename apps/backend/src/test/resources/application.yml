spring:
  application:
    name: cook-backend-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

cook:
  env: test
  env-check:
    enabled: false
  device-salt: ${DEVICE_SALT:unit-test-h2-ephemeral}
  rate-limit:
    limit: ${COOK_RATE_LIMIT_LIMIT:3}
    window-seconds: ${COOK_RATE_LIMIT_WINDOW_SECONDS:60}
  cors:
    allowed-origins: ${COOK_CORS_ALLOWED_ORIGINS:}
    allow-credentials: ${COOK_CORS_ALLOW_CREDENTIALS:false}
    max-age-seconds: ${COOK_CORS_MAX_AGE_SECONDS:3600}
  ai:
    provider: mock
    ask-enabled: false
