server:
  port: ${PORT:8080}

spring:
  application:
    name: cook-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

# Rate limiting config (can be overridden in tests)
cook:
  rate-limit:
    limit: 5
    window-seconds: 3600
  ai:
    ask-enabled: false
