# ==============================================================================
# File: apps/backend/src/main/resources/application.yml
# Làm gì: Cấu hình Spring Boot Backend (T14, T21.4, T21.6, T21.9) đọc toàn bộ
#         tham số vận hành và bí mật từ biến môi trường, tuyệt đối không chứa khóa
#         hay mật khẩu mặc định trong mã nguồn.
# ==============================================================================
server:
  port: ${PORT:8080}

spring:
  application:
    name: cook-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    validate-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    root: ${COOK_LOG_LEVEL:INFO}

cook:
  env: ${COOK_ENV:}
  device-salt: ${DEVICE_SALT:}
  rate-limit:
    limit: ${COOK_RATE_LIMIT_LIMIT:5}
    window-seconds: ${COOK_RATE_LIMIT_WINDOW_SECONDS:3600}
  cors:
    allowed-origins: ${COOK_CORS_ALLOWED_ORIGINS:}
    allow-credentials: ${COOK_CORS_ALLOW_CREDENTIALS:false}
    max-age-seconds: ${COOK_CORS_MAX_AGE_SECONDS:3600}
  ai:
    provider: ${COOK_AI_PROVIDER:}
    api-key: ${COOK_AI_API_KEY:}
    endpoint-url: ${COOK_AI_ENDPOINT_URL:}
    model: ${COOK_AI_MODEL:MISSING}
    timeout-ms: ${COOK_AI_TIMEOUT_MS:5000}
    ask-enabled: ${COOK_AI_ASK_ENABLED:false}
