name: Verify CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  verify:
    name: Run pnpm verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full JS/TS, data & secret verification pipeline
        run: pnpm verify

  backend-verify:
    name: Run backend ./mvnw verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Ensure Maven Wrapper executable permission
        run: chmod +x apps/backend/mvnw

      - name: Run Spring Boot tests & Maven verify lifecycle
        working-directory: apps/backend
        run: ./mvnw -B verify

      - name: Validate Docker Compose VPS & Managed configurations
        run: |
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config -q
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml -f deploy/docker-compose.managed.yml config -q
