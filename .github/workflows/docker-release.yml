name: Docker Backend Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Đẩy ảnh Docker lên GitHub Container Registry (GHCR) sau khi build'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-backend:
    name: Build and Push Backend Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve lowercased GHCR image repository
        id: repo
        run: |
          IMAGE_NAME="ghcr.io/$(echo "${{ github.repository }}-backend" | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry (GHCR)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.push_image == 'true'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (semver tags & OCI labels)
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.repo.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Build (and push on version tag) backend multi-stage image
        uses: docker/build-push-action@v7.4.0
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.push_image == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
